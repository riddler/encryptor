name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the toolchain: a version duplicated into
      # this file drifts the first time mise.toml moves. mise itself is not
      # used to provision CI - it would build Erlang from source.
      - name: Read the toolchain out of mise.toml
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # _build carries the Dialyzer PLT
      # (_build/dev/dialyxir_erlang-*_elixir-*_deps-dev.plt), so this cache is
      # the PLT cache too. Every dependency here is an ordinary Hex package -
      # aws_encryption_sdk is the only runtime one, and there is no path or
      # git dependency to override - so mix.lock's pins are exactly what gets
      # built, with no environment variable steering the resolution. The
      # restore-keys fallback means a lockfile bump rebuilds the PLT
      # incrementally from the previous one rather than from scratch.
      #
      # Known tradeoff, the same one the satellites accept: a warm _build
      # means the compile stage is incremental, so warnings_as_errors only
      # sees files this push actually recompiles. Deleting the cache is how to
      # get a from-scratch compile when one is wanted.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        run: mix deps.get

      # The gate is the whole job. It runs every stage .quality.exs lists -
      # the header of that file is the one stage list, kept there rather
      # than copied here, where a copy drifts the first time a stage is
      # added - printing detail under any failing stage, so a red run is
      # diagnosable from this log alone. Three stages report as
      # skipped and always will: doctor, gettext, and sobelow, none installed
      # here (they are the manifest's not_applicable_skips).
      #
      # Same reasoning as the toolchain step, applied to the gate itself: the
      # command is read out of .claude/wurk.json rather than written here, so
      # the gate CI runs and the gate an agent must have green before
      # committing are one definition with one place to change it. A gate.full
      # that grows a flag is picked up on the next run, with nothing to
      # remember. It is read and executed inside the step rather than
      # interpolated into `run:`, so a repository file never reaches the shell
      # as expression text.
      - name: Full quality gate
        run: |
          set -euo pipefail
          mapfile -t cmd < <(jq -er '.gate.full[]' .claude/wurk.json)
          test "${#cmd[@]}" -gt 0 || { echo "gate.full is empty" >&2; exit 1; }
          echo "gate command (.claude/wurk.json gate.full): ${cmd[*]}"
          "${cmd[@]}"

  # The test suite on the oldest pair the package supports, beside the gate.
  #
  # Unlike the gate job, this pair is fixed here rather than read from
  # mise.toml, on purpose: mise.toml names the development and release pair,
  # while this job proves a consumer floor - Erlang/OTP 26 with Elixir 1.18 -
  # that the package promises to compile and pass on. The two move for
  # different reasons, so they live in different places. The versions are
  # loose ("26", "1.18") so setup-beam takes the newest patch of each line.
  #
  # Compile with warnings as errors plus the test suite, nothing else:
  # Dialyzer and Credo answer about the code rather than the runtime, and
  # they stay on the gate job.
  test-otp26:
    name: Tests on Erlang/OTP 26
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "26"
          elixir-version: "1.18"

      # Keyed on the resolved pair and mix.lock, so it never shares an entry
      # with the gate job's cache.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: Run the test suite
        run: mix test

  # The AWS Encryption SDK's published decrypt vectors, beside the gate.
  #
  # The corpus is fetched, never committed: awslabs/aws-encryption-sdk-test-vectors
  # at one commit, b6a6c91 (b6a6c91e62cc67f891b5dc3d11b0f047d10baf76 below),
  # never at its default branch. Only vectors/awses-decrypt/python-2.3.0.zip is
  # used, and its SHA-256 is checked on every run before it is unzipped, so a
  # cached or re-fetched zip that is not the reviewed one fails here.
  # Encryptor.AwsVectors (test/support/aws_vectors.ex) carries the same commit
  # and checksum for a local fetch; move them together.
  #
  # ENCRYPTOR_REQUIRE_AWS_VECTORS=1 makes an absent corpus a failure of the
  # tagged tests rather than a skip. The toolchain is read out of mise.toml
  # the way the gate job reads it.
  aws-vectors:
    name: AWS Encryption SDK decrypt vectors
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_VECTORS_SHA: b6a6c91e62cc67f891b5dc3d11b0f047d10baf76
      AWS_VECTORS_ZIP_SHA256: 99b01e3bd61dfec2fc945392a0e374f510d055229fe6bb8d14ef993527164b05
      ENCRYPTOR_REQUIRE_AWS_VECTORS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Read the toolchain out of mise.toml
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # Its own key prefix, so it never shares an entry with the gate job's
      # cache (this job builds the test env only).
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-aws-vectors-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-aws-vectors-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        run: mix deps.get

      # Keyed on the corpus commit alone, with no fallback key: a cache never
      # restores a zip from another commit, and an edit to this file does not
      # throw the zip away.
      - name: Cache the vectors zip
        id: vectors-cache
        uses: actions/cache@v4
        with:
          path: test/fixtures/aws_vectors/python-2.3.0.zip
          key: aws-vectors-${{ env.AWS_VECTORS_SHA }}

      - name: Fetch the vectors at the pinned commit
        if: steps.vectors-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/aws-vectors"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/awslabs/aws-encryption-sdk-test-vectors.git "$AWS_VECTORS_SHA"
          git -C "$src" checkout -q FETCH_HEAD
          head="$(git -C "$src" rev-parse HEAD)"
          test "$head" = "$AWS_VECTORS_SHA" || { echo "fetched $head, pinned $AWS_VECTORS_SHA" >&2; exit 1; }
          mkdir -p test/fixtures/aws_vectors
          cp -f "$src/vectors/awses-decrypt/python-2.3.0.zip" test/fixtures/aws_vectors/python-2.3.0.zip

      - name: Check the zip's SHA-256
        run: echo "$AWS_VECTORS_ZIP_SHA256  test/fixtures/aws_vectors/python-2.3.0.zip" | sha256sum -c -

      - name: Unzip the vectors
        run: |
          set -euo pipefail
          rm -rf test/fixtures/aws_vectors/python-2.3.0
          unzip -q test/fixtures/aws_vectors/python-2.3.0.zip -d test/fixtures/aws_vectors/python-2.3.0

      - name: Run the aws_vectors tests
        run: mix test --only aws_vectors
