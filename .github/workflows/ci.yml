name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the toolchain: a version duplicated into
      # this file drifts the first time mise.toml moves. mise itself is not
      # used to provision CI - it would build Erlang from source.
      - name: Read the toolchain out of mise.toml
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # _build carries the Dialyzer PLT
      # (_build/dev/dialyxir_erlang-*_elixir-*_deps-dev.plt), so this cache is
      # the PLT cache too. Every dependency here is an ordinary Hex package -
      # aws_encryption_sdk is the only runtime one, and there is no path or
      # git dependency to override - so mix.lock's pins are exactly what gets
      # built, with no environment variable steering the resolution. The
      # restore-keys fallback means a lockfile bump rebuilds the PLT
      # incrementally from the previous one rather than from scratch.
      #
      # Known tradeoff, the same one the satellites accept: a warm _build
      # means the compile stage is incremental, so warnings_as_errors only
      # sees files this push actually recompiles. Deleting the cache is how to
      # get a from-scratch compile when one is wanted.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        run: mix deps.get

      # The gate is the whole job. It runs every stage .quality.exs lists -
      # the header of that file is the one stage list, kept there rather
      # than copied here, where a copy drifts the first time a stage is
      # added - printing detail under any failing stage, so a red run is
      # diagnosable from this log alone. Three stages report as
      # skipped and always will: doctor, gettext, and sobelow, none installed
      # here (they are the manifest's not_applicable_skips).
      #
      # Same reasoning as the toolchain step, applied to the gate itself: the
      # command is read out of .claude/wurk.json rather than written here, so
      # the gate CI runs and the gate an agent must have green before
      # committing are one definition with one place to change it. A gate.full
      # that grows a flag is picked up on the next run, with nothing to
      # remember. It is read and executed inside the step rather than
      # interpolated into `run:`, so a repository file never reaches the shell
      # as expression text.
      - name: Full quality gate
        run: |
          set -euo pipefail
          mapfile -t cmd < <(jq -er '.gate.full[]' .claude/wurk.json)
          test "${#cmd[@]}" -gt 0 || { echo "gate.full is empty" >&2; exit 1; }
          echo "gate command (.claude/wurk.json gate.full): ${cmd[*]}"
          "${cmd[@]}"

  # The test suite on the oldest pair the package supports, beside the gate.
  #
  # Unlike the gate job, this pair is fixed here rather than read from
  # mise.toml, on purpose: mise.toml names the development and release pair,
  # while this job proves a consumer floor - Erlang/OTP 26 with Elixir 1.18 -
  # that the package promises to compile and pass on. The two move for
  # different reasons, so they live in different places. The versions are
  # loose ("26", "1.18") so setup-beam takes the newest patch of each line.
  #
  # Compile with warnings as errors plus the test suite, nothing else:
  # Dialyzer and Credo answer about the code rather than the runtime, and
  # they stay on the gate job.
  test-otp26:
    name: Tests on Erlang/OTP 26
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "26"
          elixir-version: "1.18"

      # Keyed on the resolved pair and mix.lock, so it never shares an entry
      # with the gate job's cache.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: Run the test suite
        run: mix test

  # The AWS Encryption SDK's published decrypt vectors, beside the gate.
  #
  # The corpus is fetched, never committed: awslabs/aws-encryption-sdk-test-vectors
  # at one commit, b6a6c91 (b6a6c91e62cc67f891b5dc3d11b0f047d10baf76 below),
  # never at its default branch. Only vectors/awses-decrypt/python-2.3.0.zip is
  # used, and its SHA-256 is checked on every run before it is unzipped, so a
  # cached or re-fetched zip that is not the reviewed one fails here.
  # Encryptor.AwsVectors (test/support/aws_vectors.ex) carries the same commit
  # and checksum for a local fetch; move them together.
  #
  # ENCRYPTOR_REQUIRE_AWS_VECTORS=1 makes an absent corpus a failure of the
  # tagged tests rather than a skip. The toolchain is read out of mise.toml
  # the way the gate job reads it.
  aws-vectors:
    name: AWS Encryption SDK decrypt vectors
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_VECTORS_SHA: b6a6c91e62cc67f891b5dc3d11b0f047d10baf76
      AWS_VECTORS_ZIP_SHA256: 99b01e3bd61dfec2fc945392a0e374f510d055229fe6bb8d14ef993527164b05
      ENCRYPTOR_REQUIRE_AWS_VECTORS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Read the toolchain out of mise.toml
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # Its own key prefix, so it never shares an entry with the gate job's
      # cache (this job builds the test env only).
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-aws-vectors-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-aws-vectors-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        run: mix deps.get

      # Keyed on the corpus commit alone, with no fallback key: a cache never
      # restores a zip from another commit, and an edit to this file does not
      # throw the zip away.
      - name: Cache the vectors zip
        id: vectors-cache
        uses: actions/cache@v4
        with:
          path: test/fixtures/aws_vectors/python-2.3.0.zip
          key: aws-vectors-${{ env.AWS_VECTORS_SHA }}

      - name: Fetch the vectors at the pinned commit
        if: steps.vectors-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/aws-vectors"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/awslabs/aws-encryption-sdk-test-vectors.git "$AWS_VECTORS_SHA"
          git -C "$src" checkout -q FETCH_HEAD
          head="$(git -C "$src" rev-parse HEAD)"
          test "$head" = "$AWS_VECTORS_SHA" || { echo "fetched $head, pinned $AWS_VECTORS_SHA" >&2; exit 1; }
          mkdir -p test/fixtures/aws_vectors
          cp -f "$src/vectors/awses-decrypt/python-2.3.0.zip" test/fixtures/aws_vectors/python-2.3.0.zip

      - name: Check the zip's SHA-256
        run: echo "$AWS_VECTORS_ZIP_SHA256  test/fixtures/aws_vectors/python-2.3.0.zip" | sha256sum -c -

      - name: Unzip the vectors
        run: |
          set -euo pipefail
          rm -rf test/fixtures/aws_vectors/python-2.3.0
          unzip -q test/fixtures/aws_vectors/python-2.3.0.zip -d test/fixtures/aws_vectors/python-2.3.0

      - name: Run the aws_vectors tests
        run: mix test --only aws_vectors

  # The AWS Encryption SDK for Python against this package's messages, beside
  # the gate: Encryptor.PythonInteropTest
  # (test/encryptor/interop/python_interop_test.exs) has a vault write
  # messages Python reads and Python write messages a vault reads, at suites
  # 0x0478 and 0x0578, for a :single and a :scoped vault. Its moduledoc says
  # which directions pass today and which are asserted as known failures of
  # the engine.
  #
  # Python 3.12 comes from actions/setup-python at a full commit SHA, and the
  # SDK from test/interop/python/requirements.txt, where every package is
  # pinned by version and sha256 and pip runs with --require-hashes. Both
  # sides use a raw AES keyring under a key the test generates for the run;
  # no key is committed, no AWS account is involved, and the job fails if any
  # AWS_ variable is set. ENCRYPTOR_REQUIRE_PYTHON_INTEROP=1 makes a missing
  # interpreter a failure of the tagged tests rather than a skip. The
  # toolchain is read out of mise.toml the way the gate job reads it.
  python-interop:
    name: Interop with the Python AWS Encryption SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ENCRYPTOR_REQUIRE_PYTHON_INTEROP: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Read the toolchain out of mise.toml
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # Its own key prefix, so it never shares an entry with another job's
      # cache (this job builds the test env only).
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-python-interop-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-python-interop-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        run: mix deps.get

      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the pinned Python SDK
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/interop-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --require-hashes -r test/interop/python/requirements.txt
          "$venv/bin/python" -m pip check
          "$venv/bin/python" --version
          echo "ENCRYPTOR_INTEROP_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      - name: Check no AWS variable is set
        run: |
          set -euo pipefail
          count="$(env | grep -c '^AWS_' || true)"
          echo "AWS_ variables set: $count"
          test "$count" = "0" || { echo "::error::an AWS_ variable is set; the interop job runs without one" >&2; exit 1; }

      - name: Run the python_interop tests
        run: mix test --only python_interop

  # Encryptor.Provider.GcpKms against a live Cloud KMS test key, beside the
  # gate: Encryptor.Provider.GcpKmsLiveTest
  # (test/encryptor/provider/gcp_kms_live_test.exs) provisions, wraps and
  # unwraps on one test key, and reads a key the job's identity holds no
  # grant on. Informational: no ruleset requires it.
  #
  # The credential is Workload Identity Federation: the job's GitHub OIDC
  # token is exchanged for a short-lived one bound to a service account that
  # may use the test key only. There is no key file. The provider, the
  # service account and both key names are organisation SECRETS, never
  # variables, because a run log prints a variable in clear and masks a
  # secret; a secret is masked only as a whole string, so no step here
  # derives, splits or echoes one. Each secret reaches only the one step that
  # needs it, and the auth step exports nothing to later steps (its exported
  # project id would print unmasked): the test step is handed the
  # credentials file it wrote.
  #
  # The job runs its steps only when all four secrets are present and the
  # event is not from a fork or Dependabot (neither receives secrets).
  # Otherwise every step but the first is skipped and the first says why, so
  # the job is green and visibly skipped. The `secrets` context is not
  # allowed in an `if:`, hence the job-level flag. Neither the job nor the
  # test reads an AWS_ variable. ENCRYPTOR_REQUIRE_GCP_KMS=1 makes an absent
  # key name a failure of the tagged tests rather than a skip.
  gcp-kms-integration:
    name: Cloud KMS integration (live test key)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      RUN_GCP_KMS: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' && secrets.GCP_KMS_KEY != '' && secrets.GCP_KMS_DENIED_KEY != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Skip without the Cloud KMS secrets
        if: env.RUN_GCP_KMS != 'true'
        run: echo "::notice title=gcp-kms-integration skipped::the Cloud KMS secrets are absent, or this is a fork or Dependabot event; the live suite did not run"

      - uses: actions/checkout@v4
        if: env.RUN_GCP_KMS == 'true'

      - name: Read the toolchain out of mise.toml
        if: env.RUN_GCP_KMS == 'true'
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        if: env.RUN_GCP_KMS == 'true'
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # Its own key prefix, so it never shares an entry with another job's
      # cache (this job builds the test env only).
      - name: Cache deps and build
        if: env.RUN_GCP_KMS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-gcp-kms-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-gcp-kms-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        if: env.RUN_GCP_KMS == 'true'
        run: mix deps.get

      - name: Authenticate to Google Cloud
        if: env.RUN_GCP_KMS == 'true'
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Run the gcp_kms_integration tests
        if: env.RUN_GCP_KMS == 'true'
        run: mix test --only gcp_kms_integration
        env:
          ENCRYPTOR_REQUIRE_GCP_KMS: "1"
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          GCP_KMS_KEY: ${{ secrets.GCP_KMS_KEY }}
          GCP_KMS_DENIED_KEY: ${{ secrets.GCP_KMS_DENIED_KEY }}

  # Encryptor.Provider.Kms against a live AWS KMS test key, beside the gate:
  # Encryptor.Provider.KmsLiveTest (test/encryptor/provider/kms_live_test.exs)
  # has a scoped vault on the provider write and read a message through the
  # test key, read it under another scope's binding, and ask for a
  # provision. Informational: no ruleset requires it.
  #
  # The credential is a role assumed with the job's GitHub OIDC token, the
  # same role the aws-encryption-sdk-elixir integration tests assume; there
  # is no static access key. The role and the key's ARN are organisation
  # SECRETS, never variables, because a run log prints a variable in clear
  # and masks a secret; a secret is masked only as a whole string, so no
  # step here derives, splits or echoes one. The credential step is a
  # silent run step (its own comment says why) that hands the later steps
  # of this job temporary credentials (session token included) as AWS_
  # variables, each masked first, so it runs last before the test step and
  # nothing after the test step prints the environment. Every AWS_ variable stays inside this job: the
  # python-interop job sets none and checks that none is set.
  #
  # The job runs its steps only when both secrets are present and the event
  # is not from a fork or Dependabot (neither receives secrets). Otherwise
  # every step but the first is skipped and the first says why, so the job
  # is green and visibly skipped. The `secrets` context is not allowed in an
  # `if:`, hence the job-level flag. ENCRYPTOR_REQUIRE_AWS_KMS=1 makes an
  # absent key ARN a failure of the tagged tests rather than a skip.
  aws-kms-integration:
    name: AWS KMS integration (live test key)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      RUN_AWS_KMS: ${{ secrets.AWS_ROLE_ARN != '' && secrets.KMS_KEY_ARN != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Skip without the AWS KMS secrets
        if: env.RUN_AWS_KMS != 'true'
        run: echo "::notice title=aws-kms-integration skipped::the AWS KMS secrets are absent, or this is a fork or Dependabot event; the live suite did not run"

      - uses: actions/checkout@v4
        if: env.RUN_AWS_KMS == 'true'

      - name: Read the toolchain out of mise.toml
        if: env.RUN_AWS_KMS == 'true'
        id: toolchain
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)".*$/\1/p' mise.toml | head -1)"
          test -n "$erlang" || { echo "no erlang version in mise.toml" >&2; exit 1; }
          test -n "$elixir" || { echo "no elixir version in mise.toml" >&2; exit 1; }
          echo "erlang=$erlang" >> "$GITHUB_OUTPUT"
          echo "elixir=$elixir" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        if: env.RUN_AWS_KMS == 'true'
        with:
          otp-version: ${{ steps.toolchain.outputs.erlang }}
          elixir-version: ${{ steps.toolchain.outputs.elixir }}

      # Its own key prefix, so it never shares an entry with another job's
      # cache (this job builds the test env only).
      - name: Cache deps and build
        if: env.RUN_AWS_KMS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-aws-kms-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-aws-kms-${{ runner.os }}-otp${{ steps.toolchain.outputs.erlang }}-ex${{ steps.toolchain.outputs.elixir }}-

      - name: Fetch dependencies
        if: env.RUN_AWS_KMS == 'true'
        run: mix deps.get

      # A run step rather than aws-actions/configure-aws-credentials, whose
      # log line after a successful assumption names the role's unique id in
      # clear. `--query Credentials` keeps the assumed-role user (that id and
      # the ARN) out of the response, the call's stderr is discarded, every
      # value is masked before it is written anywhere, and a failure prints
      # one fixed line.
      - name: Assume the CI role
        if: env.RUN_AWS_KMS == 'true'
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com") \
            || { echo "::error::could not obtain the OIDC token"; exit 1; }
          token=$(jq -r .value <<<"$resp")
          echo "::add-mask::${token}"
          creds=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" --role-session-name ci \
            --web-identity-token "$token" --duration-seconds 3600 \
            --query Credentials --output json 2>/dev/null) \
            || { echo "::error::the role assumption was refused"; exit 1; }
          ak=$(jq -r .AccessKeyId <<<"$creds")
          sk=$(jq -r .SecretAccessKey <<<"$creds")
          st=$(jq -r .SessionToken <<<"$creds")
          echo "::add-mask::${ak}"; echo "::add-mask::${sk}"; echo "::add-mask::${st}"
          {
            echo "AWS_ACCESS_KEY_ID=${ak}"
            echo "AWS_SECRET_ACCESS_KEY=${sk}"
            echo "AWS_SESSION_TOKEN=${st}"
            echo "AWS_REGION=us-east-1"
          } >> "$GITHUB_ENV"

      - name: Run the aws_kms_integration tests
        if: env.RUN_AWS_KMS == 'true'
        run: mix test --only aws_kms_integration
        env:
          ENCRYPTOR_REQUIRE_AWS_KMS: "1"
          KMS_KEY_ARN: ${{ secrets.KMS_KEY_ARN }}

  # A host already on hackney 1.x (through httpoison) resolves this package
  # with no committed lock, the way a real host would: the engine comes
  # from Hex through this package's own range, beside the host's ex_aws and
  # KMS client stack. The fixture under test/fixtures/hackney1_host/ names
  # this checkout as a path dependency, so a range this package narrows is
  # caught here before a host meets it.
  #
  # No cache: the job resolves and compiles, nothing more, and a cached
  # deps/ would let a stale resolution pass for a fresh one.
  hackney-1x:
    name: Host on hackney 1.x (Elixir 1.18 / OTP 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.18"

      - name: Resolve the hackney 1.x host
        working-directory: test/fixtures/hackney1_host
        run: mix deps.get

      - name: Compile the hackney 1.x host
        working-directory: test/fixtures/hackney1_host
        run: mix compile --warnings-as-errors

      - name: Show the host's resolved engine, hackney and ex_aws
        working-directory: test/fixtures/hackney1_host
        run: grep -E '^  "(aws_encryption_sdk|hackney|ex_aws)":' mix.lock | cut -d, -f1-3
